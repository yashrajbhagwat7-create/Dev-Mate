[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "devmate-agent"
version = "0.1.0"
description = "Lightweight multi-provider AI coding agent"
requires-python = ">=3.11"
dependencies = [
    "python-dotenv>=1.0.1",
    "requests>=2.32.0",
    "prompt_toolkit>=3.0.50",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0.0",
]

[project.scripts]
devmate = "devmate.cli:main"

[tool.setuptools.packages.find]
include = ["devmate*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
