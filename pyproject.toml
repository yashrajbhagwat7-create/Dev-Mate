[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "devmate-agent"
version = "0.1.0"
description = "Lightweight multi-provider AI coding agent"
requires-python = ">=3.11"
dependencies = [
    "python-dotenv>=1.0.1",
    "requests>=2.32.0",
    "numpy>=1.24.0",
    "pandas>=2.1.0",
    "scikit-learn>=1.3.0",
    "matplotlib>=3.8.0",
]

[project.scripts]
devmate = "devmate.cli:main"

[tool.setuptools.packages.find]
include = ["devmate*", "housing*"]
